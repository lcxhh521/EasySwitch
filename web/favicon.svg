<svg xmlns="http://www.w3.org/2000/svg" width="824" height="824" viewBox="100 100 824 824">
  <title>EasySwitch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1aa5a2"/><stop offset="1" stop-color="#0a4749"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#ebe6d8"/></linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd48c"/><stop offset="1" stop-color="#f0a238"/></linearGradient>
    <filter id="body" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#00292a" flood-opacity=".35"/></filter>
    <filter id="knobShadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#5a2f00" flood-opacity=".42"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)" filter="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#gloss)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="3"/>
  <!-- An S that is also a track: it leaves one end, turns twice and arrives at the other. The amber knob is the switch. -->
  <path d="M676 322 H430 A95 95 0 0 0 430 512 H594 A95 95 0 0 1 594 702 H348" fill="none" stroke="url(#track)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="74" fill="url(#knob)" filter="url(#knobShadow)"/>
  <circle cx="512" cy="512" r="74" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
</svg>
