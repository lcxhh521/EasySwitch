<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasySwitch 控制台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">⇄</span> EasySwitch <span class="ver" id="ver"></span></div>
    <div class="chips" id="chips"></div>
  </header>

  <main>
    <section class="card">
      <h2>模型来源</h2>
      <p class="hint">从任何地方找来的模型都可以放进来：中转站、官方 API、本地模型。Key 存在 macOS 钥匙串里。</p>
      <div id="providers"></div>
      <form id="add-form" class="add">
        <input name="name" placeholder="名称，例如：我的中转站" required>
        <input name="baseUrl" placeholder="地址，例如：https://relay.example.com/v1" required>
        <input name="apiKey" type="password" placeholder="API Key" autocomplete="off">
        <button type="submit">添加</button>
      </form>
      <p class="msg" id="add-msg"></p>
    </section>

    <section class="card">
      <h2>Codex</h2>
      <p class="hint">增强会话只在 EasySwitch 打开的那个终端窗口里生效：启动时临时指定模型来源，<b>不改 ~/.codex 里的任何文件</b>。关掉窗口就回到原生。</p>
      <div class="row">
        <label>模型来源 <select id="bind-provider"></select></label>
        <label>模型 <select id="bind-model"></select></label>
        <button id="bind-save" class="secondary">保存绑定</button>
        <button id="launch">启动增强会话</button>
      </div>
      <pre class="cmd" id="cmd"></pre>
      <p class="msg" id="bind-msg"></p>
    </section>

    <section class="card">
      <h2>原生配置</h2>
      <p class="hint">EasySwitch 承诺不碰这些文件。下面是它们的实时指纹，以及里面有没有出现 EasySwitch 的痕迹。</p>
      <table class="tbl" id="native"></table>
    </section>

    <section class="card">
      <h2>最近请求</h2>
      <table class="tbl" id="log"></table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
