<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasySwitch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">⇄</span> EasySwitch <span class="ver" id="ver"></span></div>
    <nav class="seg" id="nav">
      <button data-page="agents">Agent</button>
      <button data-page="tasks">任务</button>
      <button data-page="providers">模型来源</button>
      <button data-page="accounts">订阅账号</button>
      <button data-page="sessions">会话</button>
      <button data-page="usage">用量</button>
      <button data-page="doctor">自检</button>
    </nav>
    <div class="top-right">
      <button class="chip" id="guard-chip" title="EasySwitch 不改各个 agent 自己的配置文件，点开看实时指纹"></button>
      <button class="icon-btn" id="refresh" title="刷新" aria-label="刷新">↻</button>
    </div>
  </header>
  <main id="page"></main>
  <script src="errors.js"></script>
  <script src="controls.js"></script>
  <script src="onboarding.js"></script>
  <script src="doctor.js"></script>
  <script src="parallel.js"></script>
  <script src="feedback.js"></script>
  <script src="app.js"></script>
</body>
</html>
