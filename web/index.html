<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasySwitch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="skip-link" data-skip-content>跳到主要内容</button>
  <aside class="sidebar" aria-label="EasySwitch 导航">
    <div class="brand"><img class="logo" src="favicon.svg" alt="" width="32" height="32"><span>EasySwitch <small class="ver" id="ver"></small></span></div>
    <nav class="shell-nav" id="nav" aria-label="主导航">
      <div class="nav-primary" role="group" aria-label="主要功能">
        <button data-page="overview" disabled aria-disabled="true" title="总览页待接入；当前可以从 Agent 或模型开始"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span>总览</span><small>待接入</small></button>
        <button data-page="agents"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2M3 8h2m14 0h2"/></svg></span><span>Agent</span></button>
        <button data-page="providers"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 17l9 5 9-5"/></svg></span><span>模型</span></button>
      </div>
      <div class="nav-secondary" role="group" aria-label="管理与设置">
        <button data-page="usage"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10m8 10V4m8 16v-7M2 21h20"/></svg></span><span>用量</span></button>
        <button data-page="sessions"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h16m-4-4 4 4-4 4M21 17H5m4-4-4 4 4 4"/></svg></span><span>会话记录</span></button>
        <button data-page="doctor"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8m-4-4v8"/></svg></span><span>自检</span></button>
        <button data-page="settings"><span class="nav-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></span><span>设置</span></button>
      </div>
    </nav>
    <div class="sidebar-foot"><span class="dot"></span> 独立会话 · 本机运行</div>
  </aside>
  <header class="top">
    <div class="page-heading"><h1 id="page-title">Agent</h1><p id="page-caption">为每个工具选择合适的模型</p></div>
    <div class="panel-brand"><img src="favicon.svg" alt="" width="26" height="26"><b>EasySwitch</b></div>
    <div class="top-right">
      <button class="chip" id="guard-chip" title="EasySwitch 不改各个 agent 自己的配置文件，点开看实时指纹"></button>
      <button class="icon-btn" id="refresh" title="刷新" aria-label="刷新">↻</button>
    </div>
  </header>
  <main id="page" tabindex="-1"></main>
  <script src="errors.js"></script>
  <script src="controls.js"></script>
  <script src="onboarding-draft.js"></script>
  <script src="onboarding.js"></script>
  <script src="doctor.js"></script>
  <script src="pool-suggestions.js"></script>
  <script src="automatic-pools.js"></script>
  <script src="source-health.js"></script>
  <script src="provider-import.js"></script>
  <script src="usage-display.js"></script>
  <script src="app.js"></script>
</body>
</html>
